<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Libro</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            text-align: center;
        }

        .container {
            background: white;
            width: 420px;
            margin: 40px auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        input, select {
            width: 90%;
            padding: 8px;
            margin: 5px;
        }

        img {
            margin: 10px;
            border-radius: 5px;
        }

        button {
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }

        .volver {
            display: inline-block;
            margin-top: 10px;
            text-decoration: none;
            color: white;
            background: #6c757d;
            padding: 8px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>✏ Editar Libro</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <input name="titulo" value="{{ libro.titulo }}">
        <input name="autor" value="{{ libro.autor }}">
        <input name="anio" type="number" value="{{ libro.anio }}">

        <select name="categoria">
            {% for c in categorias %}
                <option value="{{ c.id }}" {% if c.id == libro.categoria.id %}selected{% endif %}>
                    {{ c.nombre }}
                </option>
            {% endfor %}
        </select>

        {% if libro.portada %}
            <img src="{{ libro.portada.url }}" width="120">
        {% endif %}

        <input type="file" name="portada">

        <button>Actualizar</button>
    </form>

    <a href="{% url 'lista' %}" class="volver">⬅ Volver al inicio</a>
</div>

</body>
</html>
