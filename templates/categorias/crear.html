<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Categoría</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            text-align: center;
        }

        .container {
            background: white;
            width: 400px;
            margin: 40px auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        input, textarea {
            width: 90%;
            padding: 8px;
            margin: 5px;
        }

        button {
            padding: 10px;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
        }

        .volver {
            display: inline-block;
            margin-top: 10px;
            text-decoration: none;
            color: white;
            background: #6c757d;
            padding: 8px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>➕ Crear Categoría</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <input name="nombre" placeholder="Nombre" required><br>
        <textarea name="descripcion" placeholder="Descripción"></textarea><br>
        <input type="file" name="imagen" required><br>

        <button>Guardar</button>
    </form>

    <a href="{% url 'lista' %}" class="volver">⬅ Volver al inicio</a>
</div>

</body>
</html>
