<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Categorías</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            margin: 20px;
        }

        h2 {
            text-align: center;
        }

        .acciones {
            text-align: center;
            margin-bottom: 20px;
        }

        .acciones a {
            padding: 10px;
            margin: 5px;
            text-decoration: none;
            color: white;
            border-radius: 5px;
        }

        .crear {
            background: green;
        }

        .volver {
            background: gray;
        }

        .card {
            background: white;
            width: 50%;
            margin: 15px auto;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        img {
            margin-top: 10px;
            border-radius: 5px;
        }

        .botones a {
            margin-right: 10px;
            text-decoration: none;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
        }

        .editar {
            background: #17a2b8;
        }

        .eliminar {
            background: #dc3545;
        }
    </style>
</head>
<body>

<h2>📂 Categorías</h2>

<div class="acciones">
    <a href="{% url 'crear_categoria' %}" class="crear">➕ Nueva Categoría</a>
    <a href="{% url 'lista' %}" class="volver">⬅ Volver al inicio</a>
</div>

{% for c in categorias %}
    <div class="card">
        <h3>{{ c.nombre }}</h3>
        <p>{{ c.descripcion }}</p>

        {% if c.imagen %}
            <img src="{{ c.imagen.url }}" width="120">
        {% endif %}

        <div class="botones">
            <a href="{% url 'editar_categoria' c.id %}" class="editar">Editar</a>
            <a href="{% url 'eliminar_categoria' c.id %}" class="eliminar">Eliminar</a>
        </div>
    </div>
{% empty %}
    <p style="text-align:center;">No hay categorías registradas.</p>
{% endfor %}

</body>
</html>
